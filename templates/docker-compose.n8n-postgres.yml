# Canonical n8n + Postgres stack for the n8n-self-hosting-onboard skill.
# Copy to <install-path>/docker-compose.yml and pair with .env (see .env.example).
# Includes from day one: restart policy, Postgres healthcheck, log rotation,
# execution-data pruning, filesystem binary data, localhost-only port binding.

volumes:
  n8n_data:
  postgres_data:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No ports: section on purpose — Postgres stays internal to the compose network.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    logging: &default-logging
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  n8n:
    # Pin N8N_VERSION in .env for production; latest is OK for local experiments.
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-latest}
    restart: unless-stopped
    ports:
      # 127.0.0.1 = reachable only from this machine (and via Tailscale Serve proxy).
      # Set N8N_BIND=0.0.0.0 in .env ONLY for trusted-LAN access.
      - '${N8N_BIND:-127.0.0.1}:${N8N_PORT:-5678}:5678'
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Asia/Seoul}
      - TZ=${GENERIC_TIMEZONE:-Asia/Seoul}
      # Execution history pruning — prevents the most common self-hosting failure
      # (database growing until the disk fills or the UI crawls).
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=${EXECUTIONS_DATA_MAX_AGE:-168}
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=${EXECUTIONS_DATA_PRUNE_MAX_COUNT:-10000}
      - N8N_RUNNERS_ENABLED=true
      - N8N_DIAGNOSTICS_ENABLED=false
      # --- Remote access (Tailscale Serve/Funnel): uncomment and set in .env ---
      # - N8N_HOST=${N8N_HOST}
      # - N8N_PROTOCOL=https
      # - WEBHOOK_URL=${WEBHOOK_URL}
      # - N8N_PROXY_HOPS=1
      # --- LAN over plain HTTP only (trusted network; see skill Safety Rules) ---
      # - N8N_SECURE_COOKIE=false
      # - WEBHOOK_URL=${WEBHOOK_URL}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
